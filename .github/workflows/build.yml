name: Build APK (FIXED BUILDOSER)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ---------------- CODE ----------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------- PYTHON ----------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------- SYSTEM ----------------
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk

      # ---------------- CLEAN EVERYTHING ----------------
      - name: Hard reset Buildozer
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache
          rm -rf ~/.local/share/python-for-android

      # ---------------- INSTALL BUILDOZER ----------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ---------------- FORCE CLEAN INIT ----------------
      - name: Initialize Buildozer Android environment
        run: |
          buildozer --version
          buildozer android clean || true
          buildozer android update

      # ---------------- BUILD APK ----------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # ---------------- UPLOAD ----------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rng-apk
          path: bin/*.apk
