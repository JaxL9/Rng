name: Build Android APK (Stable Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------- PYTHON ----------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------- SYSTEM DEPENDENCIES ----------------
      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget openjdk-17-jdk

      # ---------------- HARD RESET (CRITICAL FIX) ----------------
      - name: Clean all Buildozer caches (fix broken platform)
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache/buildozer

      # ---------------- PYTHON DEPENDENCIES ----------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      # ---------------- FORCE python-for-android REINSTALL ----------------
      - name: Install python-for-android (stable)
        run: |
          pip uninstall -y python-for-android || true
          pip install git+https://github.com/kivy/python-for-android.git

      # ---------------- ANDROID SDK ----------------
      - name: Install Android SDK (LOCKED STABLE TOOLCHAIN)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          # Accept licenses silently
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

          # 🔥 LOCK STABLE VERSIONS (NO 37 EVER)
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # ---------------- BUILD APK ----------------
      - name: Build APK (Clean Build)
        run: |
          buildozer -v android debug

      # ---------------- UPLOAD APK ----------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rng-apk
          path: bin/*.apk
