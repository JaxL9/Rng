name: Build APK (LOCKED STABLE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------- CHECKOUT ----------------
      - uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------- PYTHON ----------------
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ---------------- SYSTEM ----------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip wget openjdk-17-jdk

      # ---------------- HARD RESET CACHE ----------------
      - name: FULL CLEAN (critical)
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache
          rm -rf ~/.local/share/python-for-android

      # ---------------- PYTHON DEPENDENCIES ----------------
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ---------------- PIN P4A (VERY IMPORTANT) ----------------
      - name: Install python-for-android (LOCKED)
        run: |
          pip uninstall -y python-for-android || true
          pip install python-for-android==2023.9.16

      # ---------------- ANDROID SDK (NO 37 EVER) ----------------
      - name: Android SDK (locked build-tools)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

          # 🔥 ONLY SAFE VERSION
          cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # ---------------- BUILD ----------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # ---------------- ARTIFACT ----------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rng-apk
          path: bin/*.apk
